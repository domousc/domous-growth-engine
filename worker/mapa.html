<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Mapa do formulário · Domous</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="/logo-domous.png" />
<style>
  /* Mesma identidade do domous.com.br: off-white quente, luzes pastel, vidro, roxo #AD2BEE,
     Space Grotesk nos títulos e Inter no texto, blocos escuros #0B0B0E alternando. */
  :root {
    --roxo: #AD2BEE; --roxo-escuro: #9B17E8; --roxo-vivo: #C23FEE; --roxo-claro: #F3E4FD;
    --texto: #16161A; --cinza: #61616B; --borda: #E3E3E8; --fundo: #F9F8F6; --escuro: #0B0B0E;
    --vidro: rgba(255,255,255,.62); --vidro-borda: rgba(255,255,255,.9);
    --sombra: inset 0 0 0 1px rgba(22,22,26,.04), 0 1px 2px rgba(22,22,26,.04), 0 18px 40px -22px rgba(40,30,60,.22);
    --degrade: linear-gradient(135deg, var(--roxo-escuro), var(--roxo-vivo));
    --verde: #1F9D63; --vermelho: #D93A3A;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--roxo); outline-offset: 2px; }
  input:focus { outline: none; border-color: var(--roxo); box-shadow: 0 0 0 4px rgba(173,43,238,.15); }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", sans-serif; color: var(--texto); background: var(--fundo); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  h1, h2, h3, h4, .kpi b, .marca b { font-family: "Space Grotesk", Inter, sans-serif; }

  /* Fundo com luzes, igual ao do site */
  .fx-fundo { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--fundo); }
  .fx-luz { position: absolute; border-radius: 999px; filter: blur(90px); }
  .fx-luz-1 { width: 720px; height: 720px; top: -260px; right: -120px; background: radial-gradient(circle, hsl(272 95% 82% / .55), transparent 65%); animation: flutua-1 28s ease-in-out infinite; }
  .fx-luz-2 { width: 640px; height: 640px; top: 35%; left: -260px; background: radial-gradient(circle, hsl(205 95% 82% / .45), transparent 65%); animation: flutua-2 34s ease-in-out infinite; }
  .fx-luz-3 { width: 560px; height: 560px; bottom: -260px; right: 10%; background: radial-gradient(circle, hsl(25 100% 84% / .45), transparent 65%); animation: flutua-1 40s ease-in-out infinite reverse; }
  @keyframes flutua-1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-120px,80px) scale(1.1); } }
  @keyframes flutua-2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(160px,-70px) scale(.92); } }
  @media (prefers-reduced-motion: reduce) { .fx-luz { animation: none; } html { scroll-behavior: auto; } }

  /* Cabeçalho em pílula de vidro escuro */
  header { position: sticky; top: 0; z-index: 10; padding: 14px 16px 0; }
  .pilula-topo { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px;
    background: rgba(11,11,14,.86); border: 1px solid rgba(255,255,255,.09); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 16px 40px -20px rgba(20,16,30,.55); color: #F5F5F5; }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .marca img { width: 28px; height: 28px; }
  .marca b { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .marca span { font-size: 12px; color: #A6A6B0; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.14); }
  .sair { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #F5F5F5; cursor: pointer; font-size: 13px; }
  .sair:hover { background: rgba(255,255,255,.12); }

  main { max-width: 1280px; margin: 0 auto; padding: 36px 16px 90px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    background: rgba(255,255,255,.7); border: 1px solid rgba(22,22,26,.08); color: #3A3A44; box-shadow: 0 1px 2px rgba(22,22,26,.05); }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--roxo); }
  h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; margin: 14px 0 8px; letter-spacing: -.03em; font-weight: 700; }
  h1 em { font-style: normal; background-image: linear-gradient(100deg, #9B17E8, #CF5CF5 45%, #9B17E8 70%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: brilho 6s ease-in-out infinite; }
  @keyframes brilho { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  h2 { font-size: 24px; margin: 56px 0 6px; letter-spacing: -.025em; font-weight: 600; }
  .sub { color: var(--cinza); margin: 0 0 20px; font-size: 15px; line-height: 1.5; }

  /* Filtros em barra de vidro */
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: fit-content; max-width: 100%; margin: 0 0 30px; padding: 6px; border-radius: 999px;
    background: var(--vidro); border: 1px solid var(--vidro-borda); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: var(--sombra); }
  select, input, button { font: inherit; font-size: 14px; }
  select, input { height: 38px; border: 1px solid var(--borda); border-radius: 999px; padding: 0 14px; background: rgba(255,255,255,.85); color: var(--texto); }
  .pilula { height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; color: var(--cinza); font-weight: 500; transition: background .25s, color .25s; }
  .pilula:hover { color: var(--texto); background: rgba(255,255,255,.8); }
  .pilula[aria-pressed="true"] { background: var(--degrade); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 22px -10px rgba(140,30,200,.6); }
  .botao { height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--degrade); color: #fff; font-weight: 600; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 22px -10px rgba(140,30,200,.6); transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
  .botao:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 14px 30px -10px rgba(140,30,200,.7); }

  /* Cartões de vidro claro */
  .vidro, .no, .grade2 > div, .funil, .grafico-caixa, .login, .vazio {
    background: var(--vidro); border: 1px solid var(--vidro-borda); border-radius: 20px;
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: var(--sombra); }

  /* Números principais em bloco escuro, como as seções escuras do site */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 24px; padding: 14px; border-radius: 26px;
    background: radial-gradient(600px circle at 0% 0%, hsl(280 85% 55% / .28), transparent 55%), radial-gradient(500px circle at 100% 100%, hsl(220 85% 55% / .16), transparent 55%), var(--escuro);
    box-shadow: 0 30px 60px -30px rgba(11,11,14,.6); }
  .kpi { border-radius: 18px; padding: 18px; background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .kpi b { display: block; font-size: 34px; font-weight: 600; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; }
  .kpi:nth-child(4) b { background: linear-gradient(135deg, #D58BFF, #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .kpi small { color: #A6A6B0; font-size: 12.5px; line-height: 1.4; display: block; margin-top: 4px; }

  .funil { display: grid; gap: 10px; margin-top: 12px; padding: 20px; }
  .funil-linha { display: grid; grid-template-columns: 230px 1fr 110px; gap: 14px; align-items: center; font-size: 14px; }
  .barra { height: 26px; background: rgba(22,22,26,.05); border-radius: 999px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--degrade); border-radius: 999px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--cinza); }
  .num b { color: var(--texto); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
  th { text-align: left; font-size: 12px; color: var(--cinza); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--borda); }
  td { padding: 11px 10px; border-bottom: 1px solid rgba(22,22,26,.06); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td a { color: var(--texto); text-decoration: none; border-bottom: 1px solid rgba(173,43,238,.35); }
  td a:hover { color: var(--roxo); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--roxo-claro); color: #8A1BC4; }
  .badge.alerta { background: #FDEAEA; color: var(--vermelho); }
  .badge.ok { background: #E4F5EC; color: var(--verde); }
  .badge.ramifica { background: var(--escuro); color: #fff; }

  .fase { margin-top: 32px; }
  .fase-titulo { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .fase-titulo h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .fase-titulo span { color: var(--cinza); font-size: 13px; }
  .raia { display: flex; gap: 14px; align-items: stretch; overflow-x: auto; padding: 14px 4px 18px; scrollbar-width: thin; }
  .raia-rotulo { flex: none; align-self: flex-start; position: sticky; left: 0; z-index: 1; width: 200px; border-radius: 20px; padding: 16px; font-size: 13px; color: #C9C9D1; line-height: 1.45;
    background: radial-gradient(260px circle at 0% 0%, hsl(280 85% 55% / .35), transparent 60%), var(--escuro); }
  .raia-rotulo b { display: block; font-family: "Space Grotesk", Inter, sans-serif; font-size: 15px; color: #fff; margin-bottom: 8px; line-height: 1.3; }
  .raia-rotulo small { color: #D58BFF; }
  .coluna { flex: none; display: flex; flex-direction: column; gap: 12px; width: 300px; }
  .seta { flex: none; align-self: center; width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-size: 15px; background: var(--degrade); box-shadow: 0 8px 18px -8px rgba(140,30,200,.6); }
  .no { padding: 16px; scroll-margin: 110px; transition: box-shadow .3s, transform .45s cubic-bezier(.2,.8,.2,1); }
  .no:hover { transform: translateY(-2px); }
  .no.destaque { box-shadow: 0 0 0 3px var(--roxo), var(--sombra); }
  .no h4 { margin: 8px 0 10px; font-size: 15px; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; }
  .no .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--cinza); }
  .op { margin-top: 9px; font-size: 13px; }
  .op-topo { display: flex; justify-content: space-between; gap: 8px; }
  .op-topo span:last-child { color: var(--cinza); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .op .barra { height: 6px; margin-top: 5px; }
  .op a { color: var(--roxo); font-size: 12px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .op a:hover { text-decoration: underline; }
  .especial { background: radial-gradient(260px circle at 100% 0%, hsl(280 85% 55% / .3), transparent 60%), var(--escuro); border-color: rgba(255,255,255,.09); color: #E6E6EA; }
  .especial h4 { color: #fff; }
  .especial .badge { background: rgba(255,255,255,.1); color: #fff; }
  .especial .badge.alerta { background: rgba(217,58,58,.25); color: #FFB4B4; }

  .grade2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  .grade2 > div { padding: 4px 22px 18px; }
  .grade2 h2 { margin-top: 18px; font-size: 20px; }
  .grafico-caixa { padding: 20px 20px 14px; margin-top: 12px; }
  .grafico svg { width: 100%; height: 180px; display: block; }
  .legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--cinza); margin-top: 10px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 6px; vertical-align: -1px; }

  .login { max-width: 440px; margin: 9vh auto 0; padding: 32px; text-align: left; }
  .login h1 { font-size: 32px; margin-top: 12px; }
  .login input { width: 100%; margin: 14px 0; height: 48px; }
  .login .botao { width: 100%; }
  .erro { color: var(--vermelho); font-size: 13px; }
  .vazio { padding: 18px 20px; color: var(--cinza); margin-top: 16px; }

  /* Entrada suave dos blocos */
  #app > * { animation: subir .6s cubic-bezier(.2,.8,.2,1) both; }
  #app > *:nth-child(2) { animation-delay: .05s; } #app > *:nth-child(3) { animation-delay: .1s; } #app > *:nth-child(4) { animation-delay: .15s; }
  @keyframes subir { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  @media (max-width: 860px) {
    .grade2 { grid-template-columns: 1fr; }
    .funil-linha { grid-template-columns: 1fr 90px; } .funil-linha .barra { grid-column: 1 / -1; grid-row: 2; }
    .marca span { display: none; }
    .filtros { border-radius: 22px; }
    .kpis { grid-template-columns: 1fr 1fr; padding: 10px; gap: 10px; }
    .kpi { padding: 14px; } .kpi b { font-size: 28px; }
    .raia-rotulo { position: static; width: 170px; }
  }
</style>
</head>
<body>
<div class="fx-fundo" aria-hidden="true"><div class="fx-luz fx-luz-1"></div><div class="fx-luz fx-luz-2"></div><div class="fx-luz fx-luz-3"></div></div>
<header>
  <div class="pilula-topo">
    <a class="marca" href="/"><img src="/logo-domous.png" alt="" width="28" height="28" /><b>Domous</b><span>Mapa do formulário</span></a>
    <button class="sair" id="sair" hidden>Sair</button>
  </div>
</header>
<main>
  <div class="filtros" id="filtros" hidden>
    <button class="pilula" data-dias="7">7 dias</button>
    <button class="pilula" data-dias="30" aria-pressed="true">30 dias</button>
    <button class="pilula" data-dias="90">90 dias</button>
    <button class="pilula" data-dias="3650">Tudo</button>
    <select id="segmento"><option value="">Todos os segmentos</option></select>
  </div>
  <div id="app"></div>
</main>

<script>
(function () {
  var app = document.getElementById("app");
  var estado = { dias: 30, segmento: "", chave: "" };
  try { estado.chave = localStorage.getItem("domous-mapa-chave") || ""; } catch (e) {}

  var TERMOS = { clientes: "clientes", orcamento: "orçamento", o_contato_certo: "o contato certo", nota_curioso: "" };
  var limpa = function (s) { return String(s || "").replace(/\{(\w+)\}/g, function (_, k) { return TERMOS[k] || ""; }); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var pct = function (a, b) { return b ? Math.round((a / b) * 100) : 0; };
  var NOMES = { contato: "Contato (nome, empresa, WhatsApp)", implicacao: "Tela da conta (implicação)", fim: "Terminou", fora: "Saiu no corte (até R$ 30 mil)" };

  function login(erro) {
    document.getElementById("filtros").hidden = true; document.getElementById("sair").hidden = true;
    app.innerHTML = '<div class="login"><span class="eyebrow">Área restrita</span><h1>Mapa do <em>formulário</em></h1><p class="sub">Digite a senha pra ver os dados.</p>' +
      '<form id="f"><input id="senha" type="password" autocomplete="current-password" placeholder="Senha" autofocus />' +
      (erro ? '<p class="erro">' + esc(erro) + "</p>" : "") + '<button class="botao" type="submit">Entrar</button></form></div>';
    document.getElementById("f").onsubmit = function (e) {
      e.preventDefault();
      estado.chave = document.getElementById("senha").value.trim();
      try { localStorage.setItem("domous-mapa-chave", estado.chave); } catch (x) {}
      carregar();
    };
  }

  function carregar() {
    if (!estado.chave) return login();
    app.innerHTML = '<p class="sub">Carregando...</p>';
    fetch("/api/comecar/mapa?dias=" + estado.dias + "&segmento=" + encodeURIComponent(estado.segmento), { headers: { "x-chave": estado.chave } })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status === 401) { try { localStorage.removeItem("domous-mapa-chave"); } catch (x) {} estado.chave = ""; return login("Senha errada."); }
        if (!res.d.ok) { app.innerHTML = '<p class="erro">Não deu pra carregar: ' + esc(res.d.erro) + "</p>"; return; }
        desenhar(res.d);
      })
      .catch(function () { app.innerHTML = '<p class="erro">Sem conexão com o servidor.</p>'; });
  }

  function desenhar(d) {
    document.getElementById("filtros").hidden = false; document.getElementById("sair").hidden = false;
    var porId = {}; d.mapa.forEach(function (p) { porId[p.id] = p; });
    var sel = document.getElementById("segmento");
    if (sel.options.length === 1 && porId.segmento) porId.segmento.opcoes.forEach(function (o) { sel.add(new Option(o.l, o.v)); });
    sel.value = estado.segmento;

    var vistas = {}; d.vistas.forEach(function (v) { vistas[v.tela] = v.n; });
    var resp = {}; d.respostas.forEach(function (r) { (resp[r.tela] = resp[r.tela] || {})[r.resposta] = r.n; });
    var respTotal = function (id) { var t = 0, o = resp[id] || {}; for (var k in o) t += o[k]; return t; };
    var pararam = {}; d.ultimos.forEach(function (u) { if (["fim", "fora"].indexOf(u.tipo) < 0 && ["fim", "fora"].indexOf(u.tela) < 0) pararam[u.tela] = (pararam[u.tela] || 0) + u.n; });
    var tot = {}; d.totais.forEach(function (t) { tot[t.tipo] = t.n; });

    var iniciaram = vistas.segmento || 0, fora = tot.fora || 0, contato = tot.contato || 0, fim = tot.fim || 0;
    var problema = (vistas.trava || 0) + (vistas.trava_sem || 0);

    var h = '<span class="eyebrow">domous.com.br/comecar</span><h1>Mapa do <em>formulário</em></h1><p class="sub">Caminho de cada lead, pergunta por pergunta, e onde as pessoas desistem. Últimos ' +
      (estado.dias >= 3650 ? "registros (tudo)" : estado.dias + " dias") + (estado.segmento ? " · " + esc((porId.segmento.opcoes.filter(function (o) { return o.v === estado.segmento; })[0] || {}).l) : "") + ".</p>";

    h += '<div class="kpis">' +
      kpi(iniciaram, "Começaram o formulário") +
      kpi(fora, "Saíram no corte (até R$ 30 mil)") +
      kpi(contato, "Deixaram o contato") +
      kpi(fim, "Terminaram (evento Lead no pixel)") +
      kpi(pct(fim, iniciaram - fora) + "%", "Terminaram, entre os qualificados") +
      kpi(pct(fim, contato) + "%", "Do contato até o fim") + "</div>";

    if (!iniciaram) h += '<div class="vazio">Ainda não tem ninguém no período. Os dados começam a aparecer quando alguém abre o domous.com.br/comecar.</div>';

    // Funil por etapa
    var etapas = [
      ["Abriram a 1ª pergunta", iniciaram], ["Responderam o faturamento", respTotal("faturamento")], ["Passaram do corte", respTotal("faturamento") - fora],
      ["Deixaram o contato", contato], ["Chegaram no problema", problema], ["Chegaram na tela da conta", vistas.implicacao || 0], ["Terminaram", fim],
    ];
    h += "<h2>Funil do formulário</h2><p class=\"sub\">Quantas pessoas chegaram em cada etapa.</p><div class=\"funil\">";
    etapas.forEach(function (e) {
      h += '<div class="funil-linha"><span>' + e[0] + '</span><div class="barra"><i style="width:' + pct(e[1], iniciaram || 1) + '%"></i></div><span class="num"><b>' + e[1] + "</b> · " + pct(e[1], iniciaram) + "%</span></div>";
    });
    h += "</div>";

    // Onde desistem
    var lista = Object.keys(pararam).map(function (t) { return { tela: t, n: pararam[t], vistas: vistas[t] || pararam[t] }; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 8);
    h += '<div class="grade2"><div><h2>Onde mais desistem</h2><p class="sub">Última tela que a pessoa viu antes de sair.</p>';
    if (!lista.length) h += '<div class="vazio">Sem desistências no período.</div>';
    else {
      h += "<table><tr><th>Tela</th><th style=\"text-align:right\">Saíram aqui</th><th style=\"text-align:right\">Taxa de saída</th></tr>";
      lista.forEach(function (l) {
        var taxa = pct(l.n, l.vistas);
        h += '<tr><td><a class="ir" data-alvo="' + esc(l.tela) + '" href="#no-' + esc(l.tela) + '">' + esc(NOMES[l.tela] || limpa((porId[l.tela] || {}).titulo) || l.tela) + '</a></td><td class="n">' + l.n +
          '</td><td class="n"><span class="badge ' + (taxa >= 40 ? "alerta" : taxa <= 15 ? "ok" : "") + '">' + taxa + "%</span></td></tr>";
      });
      h += "</table>";
    }
    h += "</div><div><h2>De onde vêm</h2><p class=\"sub\">Origem (utm_source ou site que mandou).</p>";
    if (!d.origens.length) h += '<div class="vazio">Sem dados.</div>';
    else {
      h += "<table><tr><th>Origem</th><th style=\"text-align:right\">Começaram</th><th style=\"text-align:right\">Terminaram</th></tr>";
      d.origens.forEach(function (o) { h += "<tr><td>" + esc(o.origem) + '</td><td class="n">' + o.sessoes + '</td><td class="n">' + o.fim + " · " + pct(o.fim, o.sessoes) + "%</td></tr>"; });
      h += "</table>";
    }
    h += "</div></div>";

    // Por dia
    h += '<h2>Dia a dia</h2><div class="grafico-caixa"><div class="grafico">' + grafico(d.porDia) + '</div><div class="legenda"><span><i style="background:#E3C9F7"></i>Começaram</span><span><i style="background:#AD2BEE"></i>Deixaram contato</span><span><i style="background:#0B0B0E"></i>Terminaram</span></div></div>';

    // Mapa
    h += '<h2>Mapa das perguntas</h2><p class="sub">Cada caixa é uma tela. Dentro, quanto cada resposta foi escolhida e pra onde ela leva. Clique na seta pra ir até a próxima pergunta.</p>';
    h += fase("1. Situação", "As 4 perguntas que qualificam", raia(null, ["segmento", "faturamento", "ticket", "investimento"].map(function (id) { return [id]; })));
    h += fase("2. Contato", "O lead entra no funil do Sistema aqui", raia(null, [["contato"]]));
    h += fase("3 e 4. Problema e implicação · quem já anuncia", "Cada resposta abre um caminho próprio", raiz("trava"));
    h += fase("3 e 4. Problema e implicação · quem ainda não anuncia", "Cada resposta abre um caminho próprio", raiz("trava_sem"));
    h += fase("5. Necessidade de solução", "Depois da tela da conta, todo mundo passa por aqui", raia(null, [["n_criterio"], ["prazo"]]));
    app.innerHTML = h;

    app.querySelectorAll(".ir").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var el = document.getElementById("no-" + a.getAttribute("data-alvo"));
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("destaque"); setTimeout(function () { el.classList.remove("destaque"); }, 1600);
      };
    });

    function kpi(v, t) { return '<div class="kpi"><b>' + v + "</b><small>" + t + "</small></div>"; }
    function fase(t, s, corpo) { return '<div class="fase"><div class="fase-titulo"><h3>' + t + "</h3><span>" + s + "</span></div>" + corpo + "</div>"; }

    // Uma raia por resposta da pergunta raiz (trava / trava_sem), com as perguntas em colunas.
    function raiz(id) {
      var p = porId[id]; if (!p) return "";
      var html = raia(null, [[id]]);
      p.opcoes.forEach(function (o) {
        var colunas = [], nivel = [o.proxima], vistos = {};
        while (nivel.length && colunas.length < 6) {
          colunas.push(nivel);
          var prox = [];
          nivel.forEach(function (n) { vistos[n] = 1; (porId[n] || { opcoes: [] }).opcoes.forEach(function (x) { if (x.proxima !== "implicacao" && !vistos[x.proxima] && prox.indexOf(x.proxima) < 0 && porId[x.proxima]) prox.push(x.proxima); }); });
          nivel = prox;
        }
        colunas.push(["implicacao"]); colunas.push(["n_ganho_" + o.v]);
        var escolhas = (resp[id] || {})[o.v] || 0;
        html += raia('<b>' + esc(limpa(o.l)) + "</b>" + escolhas + " pessoa" + (escolhas === 1 ? "" : "s") + " · " + pct(escolhas, respTotal(id)) + "% de quem respondeu" + (o.so ? "<br><small>Só aparece pra e-commerce</small>" : ""), colunas);
      });
      return html;
    }

    function raia(rotulo, colunas) {
      var html = '<div class="raia">' + (rotulo ? '<div class="raia-rotulo">' + rotulo + "</div>" : "");
      colunas.forEach(function (col, i) {
        if (i || rotulo) html += '<div class="seta">→</div>';
        html += '<div class="coluna">' + col.map(no).join("") + "</div>";
      });
      return html + "</div>";
    }

    function no(id) {
      var viram = vistas[id] || 0, saiu = pararam[id] || 0;
      if (id === "contato" || id === "implicacao") {
        return '<div class="no especial" id="no-' + id + '"><div class="meta"><span class="badge">' + viram + " viram</span>" + (saiu ? '<span class="badge alerta">' + saiu + " saíram aqui</span>" : "") +
          "</div><h4>" + NOMES[id] + "</h4>" + (id === "contato" ? '<div class="op">' + contato + " deixaram os dados (" + pct(contato, viram) + "%)</div>" : '<div class="op">Mostra a conta com os números da pessoa e a pergunta de solução do caminho.</div>') + "</div>";
      }
      var p = porId[id]; if (!p) return "";
      var total = respTotal(id);
      var html = '<div class="no" id="no-' + id + '"><div class="meta"><span class="badge">' + viram + " viram</span>" + (saiu ? '<span class="badge ' + (pct(saiu, viram) >= 40 ? "alerta" : "") + '">' + saiu + " saíram aqui · " + pct(saiu, viram) + "%</span>" : "") + "</div><h4>" + esc(limpa(p.titulo)) + "</h4>";
      // Seta por opção só quando as respostas levam pra lugares diferentes.
      var destinos = p.opcoes.map(function (o) { return o.proxima; }).filter(function (x, i, a) { return a.indexOf(x) === i; });
      var ramifica = destinos.length > 1;
      p.opcoes.forEach(function (o) {
        var n = (resp[id] || {})[o.v] || 0;
        var destino = !ramifica || o.proxima === "fim" ? "" : o.proxima;
        html += '<div class="op"><div class="op-topo"><span>' + esc(limpa(o.l)) + "</span><span>" + n + " · " + pct(n, total) + '%</span></div><div class="barra"><i style="width:' + pct(n, total) + '%"></i></div>' +
          (destino && id !== "trava" && id !== "trava_sem" ? '<a class="ir" data-alvo="' + destino + '">→ ' + esc(NOMES[destino] || limpa((porId[destino] || {}).titulo) || destino) + "</a>" : "") + "</div>";
      });
      var unico = !ramifica && destinos[0] !== "fim" && id !== "trava" && id !== "trava_sem" ? destinos[0] : "";
      if (unico) html += '<div class="op" style="margin-top:12px"><a class="ir" data-alvo="' + unico + '">Todas as respostas → ' + esc(NOMES[unico] || limpa((porId[unico] || {}).titulo) || unico) + "</a></div>";
      else if (ramifica && id !== "trava" && id !== "trava_sem") html = html.replace('<div class="meta">', '<div class="meta"><span class="badge ramifica">ramifica</span>');
      return html + "</div>";
    }
  }

  function grafico(dias) {
    if (!dias.length) return '<div class="vazio">Sem dados no período.</div>';
    var W = 900, H = 170, max = Math.max.apply(null, dias.map(function (d) { return d.iniciou; }).concat([1]));
    var w = W / dias.length, s = '<svg viewBox="0 0 ' + W + " " + (H + 20) + '" preserveAspectRatio="none">';
    dias.forEach(function (d, i) {
      var x = i * w + w * 0.15, bw = w * 0.7;
      [[d.iniciou, "#E3C9F7", 0], [d.contato, "#AD2BEE", 0.2], [d.fim, "#0B0B0E", 0.4]].forEach(function (b) {
        var hh = (b[0] / max) * H;
        s += '<rect x="' + (x + bw * b[2] / 2) + '" y="' + (H - hh) + '" width="' + bw * (1 - b[2]) + '" height="' + hh + '" rx="3" fill="' + b[1] + '"><title>' + d.dia + ": " + b[0] + "</title></rect>";
      });
      if (dias.length <= 31 && (i % Math.ceil(dias.length / 10) === 0)) s += '<text x="' + (x + bw / 2) + '" y="' + (H + 15) + '" font-size="11" text-anchor="middle" fill="#61616B">' + d.dia.slice(8, 10) + "/" + d.dia.slice(5, 7) + "</text>";
    });
    return s + "</svg>";
  }

  document.querySelectorAll("[data-dias]").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("[data-dias]").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true"); estado.dias = Number(b.getAttribute("data-dias")); carregar();
    };
  });
  document.getElementById("segmento").onchange = function (e) { estado.segmento = e.target.value; carregar(); };
  document.getElementById("sair").onclick = function () { try { localStorage.removeItem("domous-mapa-chave"); } catch (x) {} estado.chave = ""; login(); };
  carregar();
})();
</script>
</body>
</html>
